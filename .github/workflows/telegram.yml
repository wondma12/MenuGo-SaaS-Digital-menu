name: Telegram Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Manual update / push"
          fi

          MESSAGE="🎯 <b>MenuGo Deployment</b>\n\n✅ <b>Status:</b> SUCCESS\n\n━━━━━━━━━━━━━━━━━━━\n\n👤 <b>Author:</b> ${{ github.actor }}\n🌿 <b>Branch:</b> ${{ github.ref_name }}\n\n📝 <b>Commit:</b>\n<code>${COMMIT_MSG}</code>\n\n━━━━━━━━━━━━━━━━━━━\n\n🔗 <a href='https://github.com/${{ github.repository }}/commit/${{ github.sha }}'>View Commit Details</a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}"