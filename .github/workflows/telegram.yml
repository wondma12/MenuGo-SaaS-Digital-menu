name: Telegram Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Manual push / update"
          fi

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets are not set. Skipping notification."
            exit 0
          fi

          MESSAGE=$(cat <<EOF
          🚀 <b>MenuGo Deployment</b>

          ━━━━━━━━━━━━━━━━━━━━━━
          🟢 <b>Status:</b> SUCCESS
          ━━━━━━━━━━━━━━━━━━━━━━

          👤 <b>Author:</b> <code>${{ github.actor }}</code>
          🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>

          📝 <b>Commit Message:</b>
          <pre>$COMMIT_MSG</pre>

          🔗 <b>Repository:</b>
          <a href='https://github.com/${{ github.repository }}'>Open Repo</a>

          📌 <b>Commit:</b>
          <a href='https://github.com/${{ github.repository }}/commit/${{ github.sha }}'>View Changes</a>

          ━━━━━━━━━━━━━━━━━━━━━━
          ⚡ MenuGo CI/CD Pipeline
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}"
